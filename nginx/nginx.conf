events {}
http {
    upstream frontend {
        server frontend:5173;  # El nombre del servicio 'frontend' en Docker Compose
    }
    server {
        listen 80; # listen all the aplication comming from http cuz vthis is http port
        server_name frontend-center.local; # esto debe coincidir con el /etc/host que cambiamos va a ser nuestro virtual host

        # Redirect /example to root
        # Redirect /example* to /example-page
        location ~ ^/example {
            return 301 /example-page;
        }

        # # Redirigir todas las solicitudes frontend-center.local al contenedor de frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;  # Añadido para pasar la IP real
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Añadido para el seguimiento de la cadena de proxies

            # Evita que Nginx intente servir archivos TSX, TS, JS, CSS, SVG, etc.
            # rewrite ^/(.*\.(ts|tsx|js|jsx|css|scss|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|otf|mp4|webm|mp3|wav|ogg|m4a|flac|aac|json|map))$ /$1 break;
        }

        # Si necesitas manejar WebSockets
        location /ws {
            proxy_pass http://frontend;  # Redirigir las solicitudes WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

            # Asegúrate de que los archivos estáticos no se redirijan a index.html
        location = /favicon.ico {
            try_files /favicon.ico =404;
        }

        location /static/ {
            root /frontend-center/dist;  # Ajusta esta ruta para servir los archivos estáticos correctamente
        }
        
        location /assets/ {
            root /frontend-center;  # Ajusta la ruta aquí también si es necesario
        }
    }
}

